# ExtentReports Cucumber 7 adapter configuration
extent.reporter.spark.start=true
extent.reporter.spark.config=src/test/resources/spark-config.xml

# Each run gets its own timestamped folder: target/reports/<timestamp>/
basefolder.name=target/reports/ExtentReport
basefolder.datetimepattern=yyyy-MM-dd_HH-mm-ss
extent.reporter.spark.out=Spark/index.html

extent.reporter.pdf.start=true
extent.reporter.pdf.out=PdfReport/ExtentPdf.pdf

# Screenshots attached via scenario.attach(...) are written to disk and linked from the report
screenshot.dir=screenshots/
screenshot.rel.path=../screenshots/

# Environment details shown on the dashboard
systeminfo.Framework=Cucumber 7 + Selenium 4 + REST Assured + TestNG
systeminfo.UI Targets=saucedemo.com, the-internet.herokuapp.com
systeminfo.API Targets=restful-booker.herokuapp.com, reqres.in
