# ---------------------------------------------------------------------------
# Framework configuration.
# Any key can be overridden with -D<key>=<value> or an environment variable
# (upper-case, dots -> underscores), e.g. -Dbrowser=firefox or HEADLESS=true.
# ---------------------------------------------------------------------------

# ---- Browser ----
# chrome | firefox | edge
browser=chrome
headless=false
# Leave blank to run locally; set to e.g. http://localhost:4444 to use Selenium Grid
grid.url=
explicit.wait.seconds=10
page.load.timeout.seconds=30
# normal | eager | none
page.load.strategy=eager

# ---- UI targets ----
saucedemo.url=https://www.saucedemo.com/
# Public demo password published on the Sauce Demo login page
saucedemo.username=standard_user
saucedemo.password=secret_sauce
herokuapp.url=https://the-internet.herokuapp.com

# ---- API targets ----
api.booker.base.url=https://restful-booker.herokuapp.com
# Public demo credentials documented in the Restful Booker API docs
api.booker.username=admin
api.booker.password=password123

api.reqres.base.url=https://reqres.in
# ReqRes rejects requests without an API key; this is the public free-tier key
api.reqres.api.key=reqres-free-v1
